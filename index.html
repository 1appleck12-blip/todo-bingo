<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>やることノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2C3C63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="やることノート">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifestLink">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#F7F2E7;--paper-dark:#EAE2CF;--ink:#272320;--ink-soft:#6b6258;
  --indigo:#2C3C63;--indigo-soft:#5b6c92;--vermillion:#B5392C;--vermillion-soft:#c97b6e;
  --gold:#B0892F;--line:#d8cdb2;
}
*{box-sizing:border-box;}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(176,137,47,.06),transparent 40%),radial-gradient(circle at 85% 90%,rgba(44,60,99,.06),transparent 40%),var(--paper);font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);}

/* Loading */
#loading-screen{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.loading-logo{font-family:'Shippori Mincho',serif;font-size:28px;font-weight:700;color:var(--indigo);margin-bottom:20px;}
.loading-spinner{width:32px;height:32px;border:2.5px solid var(--line);border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Login */
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:32px 20px;}
.login-card{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:36px 28px;max-width:360px;width:100%;text-align:center;}
.login-card h1{font-family:'Shippori Mincho',serif;font-size:26px;margin:0 0 8px;color:var(--ink);}
.login-card p{font-size:13px;color:var(--ink-soft);margin:0 0 28px;line-height:1.7;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,transform .15s;}
.google-btn:hover{background:var(--paper-dark);border-color:var(--indigo-soft);}
.google-btn:active{transform:scale(.96);}
.google-icon{width:20px;height:20px;flex:none;}
.login-note{font-size:11px;color:var(--ink-soft);margin-top:12px;line-height:1.6;}

/* Main app */
#app{display:none;max-width:480px;margin:0 auto;padding:20px 16px 60px;}

/* User bar */
.user-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.user-avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);object-fit:cover;flex:none;}
.user-display-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.logout-btn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;flex:none;transition:border-color .2s,color .2s,transform .15s;}
.logout-btn:active{transform:scale(.94);}

/* Header */
header{margin-bottom:18px;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);}
h1{font-family:'Shippori Mincho',serif;font-weight:700;font-size:28px;margin:2px 0 6px;letter-spacing:.02em;}
.subtitle{font-size:13px;line-height:1.7;color:var(--ink-soft);margin:0;}

/* Save status */
.save-bar{min-height:14px;text-align:center;margin-bottom:4px;}
.save-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}

/* Tabs */
.tabbar{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s;}
.tab-btn.active{background:var(--indigo);border-color:var(--indigo);color:var(--paper);}
.tab-btn:active{transform:scale(.94);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Panel header */
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.panel-title{font-family:'Shippori Mincho',serif;font-weight:700;font-size:18px;}

/* Bingo badge */
.bingo-badge{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--vermillion);border:1px solid var(--vermillion-soft);border-radius:999px;padding:4px 10px 4px 8px;background:rgba(181,57,44,.06);}
.bingo-badge .count{font-size:15px;font-weight:700;}

/* Bingo boards */
.bingo-board-card{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:14px 12px 12px;margin-bottom:18px;position:relative;}
.board-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.board-card-title{font-family:'Shippori Mincho',serif;font-weight:700;font-size:16px;color:var(--ink);outline:none;border-bottom:1px dashed transparent;padding:2px 4px;min-width:60px;max-width:200px;border-radius:4px;cursor:text;}
.board-card-title:focus{border-bottom-color:var(--indigo-soft);background:rgba(44,60,99,.04);}
.size-switcher{display:flex;gap:6px;margin-bottom:10px;}
.size-btn{font-size:11px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .12s;}
.size-btn.active{background:var(--indigo);border-color:var(--indigo);color:var(--paper);}
.size-btn:active{transform:scale(.92);}
.board-wrap{position:relative;margin-top:0;}
.board{display:grid;gap:6px;aspect-ratio:1/1;}
.lines-overlay{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.lines-overlay path{fill:none;stroke:var(--indigo);stroke-width:1.6;stroke-linecap:round;opacity:0;transition:stroke-dashoffset .65s cubic-bezier(.2,.8,.2,1),opacity .2s ease;}
.lines-overlay path.achieved{opacity:.85;}
.cell{position:relative;border-radius:8px;background:#fffdf8;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:border-color .25s,background .25s;}
.cell.empty{background:transparent;border:1.5px dashed var(--line);align-items:center;justify-content:center;cursor:text;color:var(--ink-soft);}
.cell.empty:active{transform:scale(.97);}
.empty-hint{font-size:13px;text-align:center;line-height:1.6;padding:8px;pointer-events:none;}
.empty-hint .plus{font-size:20px;display:block;margin-bottom:2px;font-family:'JetBrains Mono',monospace;}
.cell textarea{width:100%;height:100%;border:none;background:transparent;resize:none;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;line-height:1.55;padding:10px;color:var(--ink);outline:none;}
.cell-text{flex:1;padding:10px 10px 6px;white-space:pre-wrap;word-break:break-word;cursor:text;}
.cell.done .cell-text{color:var(--ink-soft);}
.stamp-btn{align-self:flex-end;margin:0 6px 6px auto;border-radius:50%;border:1.4px solid var(--indigo-soft);background:transparent;color:var(--indigo-soft);font-family:'JetBrains Mono',monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s,color .15s;}
.stamp-btn:active{transform:scale(.88);}
.stamp-mark{position:absolute;top:50%;right:10px;border:2.5px solid var(--vermillion);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--vermillion);font-family:'Shippori Mincho',serif;font-weight:700;transform:rotate(-10deg) scale(0);opacity:0;transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .2s;cursor:pointer;background:rgba(181,57,44,.04);}
.cell.done .stamp-mark{transform:rotate(-10deg) scale(1);opacity:1;}
.stamp-mark:active{transform:rotate(-10deg) scale(.9)!important;}
.cell.done .stamp-btn{display:none;}
.cell.done{border-color:#e2d9be;}
.board-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;}
.delete-board-btn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:border-color .2s,color .2s,transform .15s;}
.delete-board-btn:active{transform:scale(.94);}
.add-board-btn{display:block;width:100%;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;color:var(--indigo);background:transparent;border:1.5px dashed var(--indigo-soft);border-radius:10px;padding:14px;cursor:pointer;text-align:center;margin-bottom:10px;transition:background .2s,border-color .2s,transform .15s;}
.add-board-btn:hover{background:rgba(44,60,99,.05);border-color:var(--indigo);}
.add-board-btn:active{transform:scale(.98);}
.bingo-board-card .toast{position:absolute;bottom:auto;top:8px;left:50%;transform:translateX(-50%) translateY(-4px);font-size:12px;padding:6px 16px;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;z-index:10;}
.bingo-board-card .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Todo lists */
.todo-input-row{display:flex;gap:8px;margin-bottom:14px;}
.todo-input-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;background:#fffdf8;outline:none;color:var(--ink);}
.todo-input-row input:focus{border-color:var(--indigo-soft);}
.add-btn{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--paper);background:var(--indigo);border:none;border-radius:8px;padding:0 16px;cursor:pointer;flex:none;transition:transform .15s;}
.add-btn:active{transform:scale(.93);}
.todo-list{display:flex;flex-direction:column;gap:8px;min-height:8px;}
.todo-row{display:flex;align-items:center;gap:10px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;transition:border-color .2s;}
.todo-row.done{border-color:#e2d9be;}
.todo-stamp-wrap{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;}
.stamp-btn.small{position:static;width:24px;height:24px;margin:0;font-size:10px;}
.stamp-mark.small{position:static;width:30px;height:30px;margin:0;font-size:13px;transform:rotate(-10deg) scale(1);opacity:1;}
.todo-text{flex:1;font-size:13px;line-height:1.5;word-break:break-word;}
.todo-row.done .todo-text{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--vermillion-soft);}
.todo-del{flex:none;width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--ink-soft);font-size:16px;line-height:1;cursor:pointer;transition:color .15s,transform .15s;}
.todo-del:hover{color:var(--vermillion);}
.todo-del:active{transform:scale(.85);}
.todo-footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;}
.todo-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
.todo-empty-hint{font-size:12px;color:var(--ink-soft);text-align:center;padding:24px 0;opacity:.65;}

/* Numbered list */
.numbered-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-height:8px;}
.numbered-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;transition:border-color .2s,opacity .2s;}
.numbered-row.done{border-color:#e2d9be;opacity:.7;}
.numbered-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);min-width:20px;padding-top:2px;flex:none;font-weight:700;}
.numbered-row.done .numbered-num{color:var(--ink-soft);}
.numbered-text{flex:1;font-size:13px;line-height:1.55;word-break:break-word;padding-top:1px;}
.numbered-row.done .numbered-text{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--vermillion-soft);}
.numbered-done-btn{flex:none;width:24px;height:24px;border-radius:50%;border:1.4px solid var(--indigo-soft);background:transparent;color:var(--indigo-soft);font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s;}
.numbered-done-btn:active{transform:scale(.85);}
.numbered-row.done .numbered-done-btn{border-color:var(--vermillion);color:var(--vermillion);font-size:13px;}
.numbered-del{flex:none;width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--ink-soft);font-size:15px;line-height:1;cursor:pointer;transition:color .15s,transform .15s;padding-top:1px;}
.numbered-del:hover{color:var(--vermillion);}
.numbered-del:active{transform:scale(.85);}
.numbered-add-row{display:flex;gap:8px;margin-bottom:10px;}
.numbered-add-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;background:#fffdf8;outline:none;color:var(--ink);}
.numbered-add-row input:focus{border-color:var(--indigo-soft);}
.numbered-empty-hint{font-size:12px;color:var(--ink-soft);text-align:center;padding:20px 0;opacity:.65;}

/* Deadline */
.deadline-input-block{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.deadline-input-block .todo-input-row{margin-bottom:0;}
.deadline-date-row{display:flex;align-items:center;gap:8px;}
.deadline-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);flex:none;}
input[type="date"]{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;background:#fffdf8;outline:none;color:var(--ink);-webkit-appearance:none;}
input[type="date"]:focus{border-color:var(--indigo-soft);}
.deadline-chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;margin-top:3px;}
.deadline-chip.overdue{border-color:var(--vermillion-soft);color:var(--vermillion);background:rgba(181,57,44,.06);}
.deadline-chip.soon{border-color:var(--gold);color:var(--gold);background:rgba(176,137,47,.06);}
.todo-text-wrap{flex:1;display:flex;flex-direction:column;gap:2px;}

/* Entertainment */
.entame-input-block{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.entame-cat-row{display:flex;gap:6px;flex-wrap:wrap;}
.cat-btn{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .12s;white-space:nowrap;}
.cat-btn.active{background:var(--indigo);border-color:var(--indigo);color:var(--paper);}
.cat-btn:active{transform:scale(.92);}
.entame-filter-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-ms-overflow-style:none;scrollbar-width:none;}
.entame-filter-row::-webkit-scrollbar{display:none;}
.filter-btn{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;white-space:nowrap;flex:none;transition:background .18s,border-color .18s,color .18s,transform .12s;}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--paper);}
.filter-btn:active{transform:scale(.92);}
.entame-cat-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:999px;margin-right:6px;flex:none;}
.cat-tag-映画{background:rgba(44,60,99,.12);color:var(--indigo);}
.cat-tag-ドラマ{background:rgba(176,137,47,.12);color:var(--gold);}
.cat-tag-本{background:rgba(181,57,44,.10);color:var(--vermillion);}
.cat-tag-アニメ{background:rgba(90,140,100,.12);color:#3a7a4a;}
.cat-tag-その他{background:rgba(107,98,88,.10);color:var(--ink-soft);}

/* Reset/clear buttons */
.reset-btn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;transition:border-color .2s,color .2s,transform .15s;}
.reset-btn:hover{border-color:var(--vermillion-soft);color:var(--vermillion);}
.reset-btn:active{transform:scale(.96);}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--indigo);color:var(--paper);font-family:'Shippori Mincho',serif;font-size:14px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;letter-spacing:.04em;z-index:9998;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Confetti */
.confetti-piece{position:absolute;left:50%;top:38%;pointer-events:none;}
@keyframes confetti-burst{0%{transform:translate(0,0) rotate(0deg);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0;}}

/* Install note */
.install-note{font-size:11px;color:var(--ink-soft);opacity:.6;text-align:center;max-width:320px;line-height:1.6;margin:16px auto 0;}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">やることノート</div>
  <div class="loading-spinner"></div>
</div>

<div id="login-screen">
  <div class="login-card">
    <h1>やることノート</h1>
    <p>Googleアカウントでログインすると<br>どの端末からでも同じデータを使えます</p>
    <button class="google-btn" id="google-login-btn">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <p class="login-note">ログインするとデータはGoogleのサーバーに保存され、機種変更後もそのまま使えます</p>
  </div>
</div>

<div id="app">
  <div class="user-bar">
    <img class="user-avatar" id="user-avatar" src="" alt="">
    <span class="user-display-name" id="user-name"></span>
    <button class="logout-btn" id="logout-btn">ログアウト</button>
  </div>

  <header>
    <div class="eyebrow" id="dateLabel"></div>
    <h1>やることノート</h1>
    <p class="subtitle">タブを切り替えて、ビンゴ・今日・今週・今月・今年のやることを記録する。</p>
  </header>

  <div class="save-bar"><span class="save-status" id="saveStatus"></span></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="bingo">ビンゴ</button>
    <button class="tab-btn" data-tab="daily">Daily</button>
    <button class="tab-btn" data-tab="weekly">Weekly</button>
    <button class="tab-btn" data-tab="monthly">Monthly</button>
    <button class="tab-btn" data-tab="yearly">Yearly</button>
    <button class="tab-btn" data-tab="numbered">リスト</button>
    <button class="tab-btn" data-tab="someday">いつか</button>
    <button class="tab-btn" data-tab="deadline">期限付き</button>
    <button class="tab-btn" data-tab="waiting">時がきたら</button>
    <button class="tab-btn" data-tab="entame">エンタメ</button>
  </nav>

  <!-- Bingo -->
  <section class="tab-panel active" id="panel-bingo">
    <div class="panel-header"><span class="panel-title">ビンゴ</span></div>
    <div id="bingo-boards-container"></div>
    <button class="add-board-btn" id="add-board-btn">＋ ボードを追加</button>
  </section>

function spawnConfetti(){
  const colors=['#B5392C','#2C3C63','#B0892F','#EAE2CF','#8a8070'];
  const container=document.createElement('div');
  container.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
  document.body.appendChild(container);
  for(let i=0;i<40;i++){
    const piece=document.createElement('span');
    piece.className='confetti-piece';
    const angle=Math.random()*Math.PI*2,dist=90+Math.random()*170;
    const tx=Math.cos(angle)*dist,ty=Math.sin(angle)*dist*0.6+100+Math.random()*120;
    const size=5+Math.random()*6;
    piece.style.width=size+'px';piece.style.height=(size*1.8)+'px';
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.borderRadius=Math.random()>.5?'2px':'50%';
    piece.style.setProperty('--tx',tx+'px');piece.style.setProperty('--ty',ty+'px');
    piece.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    piece.style.animation=`confetti-burst ${(0.9+Math.random()*0.6).toFixed(2)}s cubic-bezier(.2,.7,.4,1) forwards`;
    container.appendChild(piece);
  }
  setTimeout(()=>container.remove(),1700);
}
function playCracker(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    const ctx=new Ctx();if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime;
    const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.25),ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const n=ctx.createBufferSource();n.buffer=buf;
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=700;
    const g=ctx.createGain();g.gain.setValueAtTime(.55,now);g.gain.exponentialRampToValueAtTime(.001,now+.25);
    n.connect(f).connect(g).connect(ctx.destination);n.start(now);
    [880,1320,1760].forEach((freq,idx)=>{
      const o=ctx.createOscillator();o.type='sine';o.frequency.value=freq;
      const og=ctx.createGain();const t0=now+.05+idx*.07;
      og.gain.setValueAtTime(.0001,t0);og.gain.exponentialRampToValueAtTime(.16,t0+.02);og.gain.exponentialRampToValueAtTime(.0001,t0+.18);
      o.connect(og).connect(ctx.destination);o.start(t0);o.stop(t0+.2);
    });
    setTimeout(()=>ctx.close(),800);
  }catch(e){}
}
function celebrate(toastEl){
  if(toastEl){toastEl.classList.add('show');clearTimeout(celebrate._t);celebrate._t=setTimeout(()=>toastEl.classList.remove('show'),1600);}
  else showMainToast();
  spawnConfetti();playCracker();
}

// ---- Bingo ----
function buildLines(n){
  const lines=[];
  for(let r=0;r<n;r++){const row=[];for(let c=0;c<n;c++)row.push(r*n+c);lines.push(row);}
  for(let c=0;c<n;c++){const col=[];for(let r=0;r<n;r++)col.push(r*n+c);lines.push(col);}
  const d1=[],d2=[];for(let i=0;i<n;i++){d1.push(i*n+i);d2.push(i*n+(n-1-i));}lines.push(d1,d2);
  return lines;
}
function buildSvgLines(svg,n){
  svg.innerHTML='';
  const lines=buildLines(n);const step=100/n;
  const centers=Array.from({length:n},(_,i)=>step*(i+.5));
  lines.forEach((combo,i)=>{
    const a=combo[0],z=combo[combo.length-1];
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${centers[a%n]} ${centers[Math.floor(a/n)]} L ${centers[z%n]} ${centers[Math.floor(z/n)]}`);
    path.dataset.lineIndex=i;svg.appendChild(path);
  });
  Array.from(svg.querySelectorAll('path')).forEach(p=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;});
}
function fontFs(n){return n<=3?'13px':n===4?'11px':'9px';}
function stampSz(n){return n<=3?46:n===4?34:26;}

function createBoardCard(boardData){
  const card=document.createElement('div');
  card.className='bingo-board-card';card.dataset.id=boardData.id;
  const header=document.createElement('div');header.className='board-card-header';
  const titleEl=document.createElement('div');titleEl.className='board-card-title';
  titleEl.contentEditable='true';titleEl.textContent=boardData.title;
  titleEl.addEventListener('blur',()=>{boardData.title=titleEl.textContent.trim()||'ボード';scheduleSave('bingo');});
  titleEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();titleEl.blur();}});
  header.appendChild(titleEl);
  const badge=document.createElement('div');badge.className='bingo-badge';
  badge.innerHTML='ビンゴ <span class="count">0</span>';header.appendChild(badge);
  card.appendChild(header);
  const sizeSw=document.createElement('div');sizeSw.className='size-switcher';
  [3,4,5].forEach(n=>{
    const btn=document.createElement('button');btn.className='size-btn'+(boardData.size===n?' active':'');
    btn.textContent=`${n}×${n}`;
    btn.addEventListener('click',()=>{
      if(boardData.size===n)return;
      boardData.size=n;boardData.cells=Array.from({length:n*n},()=>({text:'',done:false}));
      sizeSw.querySelectorAll('.size-btn').forEach(b=>b.classList.toggle('active',parseInt(b.textContent)===n));
      buildSvgLines(svgEl,n);rerenderBoard();scheduleSave('bingo');
    });
    sizeSw.appendChild(btn);
  });
  card.appendChild(sizeSw);
  const boardWrap=document.createElement('div');boardWrap.className='board-wrap';
  const boardEl=document.createElement('div');boardEl.className='board';
  const svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.setAttribute('class','lines-overlay');svgEl.setAttribute('viewBox','0 0 100 100');svgEl.setAttribute('preserveAspectRatio','none');
  boardWrap.appendChild(boardEl);boardWrap.appendChild(svgEl);card.appendChild(boardWrap);
  const toastEl=document.createElement('div');toastEl.className='toast';toastEl.textContent='ビンゴ!';card.appendChild(toastEl);
  const footer=document.createElement('div');footer.className='board-card-footer';
  let rp=false,rt=null;
  const resetBtn=document.createElement('button');resetBtn.className='reset-btn';resetBtn.textContent='盤面をリセット';
  resetBtn.addEventListener('click',()=>{
    if(!rp){rp=true;resetBtn.textContent='もう一度タップで確定';resetBtn.style.color='var(--vermillion)';
      rt=setTimeout(()=>{rp=false;resetBtn.textContent='盤面をリセット';resetBtn.style.color='';},3000);
    }else{clearTimeout(rt);rp=false;resetBtn.textContent='盤面をリセット';resetBtn.style.color='';
      boardData.cells=Array.from({length:boardData.size*boardData.size},()=>({text:'',done:false}));rerenderBoard();scheduleSave('bingo');}
  });
  footer.appendChild(resetBtn);
  let dp=false,dt=null;
  const delBtn=document.createElement('button');delBtn.className='delete-board-btn';delBtn.textContent='削除';
  delBtn.addEventListener('click',()=>{
    if(!dp){dp=true;delBtn.textContent='もう一度で削除';delBtn.style.color='var(--vermillion)';
      dt=setTimeout(()=>{dp=false;delBtn.textContent='削除';delBtn.style.color='';},3000);
    }else{clearTimeout(dt);appData.bingo.boards=appData.bingo.boards.filter(b=>b.id!==boardData.id);card.remove();scheduleSave('bingo');}
  });
  footer.appendChild(delBtn);card.appendChild(footer);
  let lastAchieved=0;
  function checkLines(){
    const lines=buildLines(boardData.size);let count=0;
    lines.forEach((combo,i)=>{
      const allDone=combo.every(idx=>boardData.cells[idx].done);
      const path=svgEl.querySelector(`path[data-line-index="${i}"]`);if(!path)return;
      if(allDone){count++;if(!path.classList.contains('achieved')){path.classList.add('achieved');path.style.strokeDashoffset=0;}}
      else{if(path.classList.contains('achieved')){path.classList.remove('achieved');path.style.strokeDashoffset=path.getTotalLength();}}
    });
    badge.querySelector('.count').textContent=count;
    if(count>lastAchieved)celebrate(toastEl);lastAchieved=count;
  }
  function renderCell(idx){
    const n=boardData.size,data=boardData.cells[idx];
    const el=document.createElement('div');
    el.className='cell'+(data.done?' done':'')+(!data.text&&!data.done?' empty':'');
    el.dataset.idx=idx;const fs=fontFs(n),ss=stampSz(n);
    if(!data.text&&!data.done){
      el.innerHTML=`<div class="empty-hint" style="font-size:${fs}"><span class="plus">+</span>入力</div>`;
      el.addEventListener('click',()=>startEdit(idx));
    }else{
      const td=document.createElement('div');td.className='cell-text';td.style.fontSize=fs;td.textContent=data.text;
      if(!data.done)td.addEventListener('click',()=>startEdit(idx));el.appendChild(td);
      if(data.done){
        const stamp=document.createElement('div');stamp.className='stamp-mark';
        stamp.style.cssText=`width:${ss}px;height:${ss}px;margin-top:${-ss/2}px;font-size:${ss*.4}px`;
        stamp.textContent='済';stamp.addEventListener('click',e=>{e.stopPropagation();data.done=false;rerenderBoard();scheduleSave('bingo');});el.appendChild(stamp);
      }else{
        const btn=document.createElement('button');btn.className='stamp-btn';
        btn.style.cssText=`width:${ss*.6}px;height:${ss*.6}px;font-size:${ss*.24}px`;
        btn.textContent='印';btn.addEventListener('click',e=>{e.stopPropagation();data.done=true;rerenderBoard();scheduleSave('bingo');});el.appendChild(btn);
      }
    }
    return el;
  }
  function startEdit(idx){
    const data=boardData.cells[idx];const el=boardEl.querySelector(`.cell[data-idx="${idx}"]`);
    el.className='cell';el.innerHTML='';
    const ta=document.createElement('textarea');ta.value=data.text;ta.placeholder='入力…';ta.maxLength=40;ta.style.fontSize=fontFs(boardData.size);
    el.appendChild(ta);ta.focus();
    ta.addEventListener('blur',()=>{data.text=ta.value.trim();rerenderBoard();scheduleSave('bingo');});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ta.blur();}});
  }
  function rerenderBoard(){
    const n=boardData.size;boardEl.style.gridTemplateColumns=`repeat(${n},1fr)`;boardEl.innerHTML='';
    boardData.cells.forEach((_,idx)=>boardEl.appendChild(renderCell(idx)));checkLines();
  }
  buildSvgLines(svgEl,boardData.size);rerenderBoard();
  return card;
}

function newBoardData(size,num){
  return{id:Date.now()+'-'+Math.random().toString(36).slice(2),title:'ボード'+(num||''),size:size||3,cells:Array.from({length:(size||3)*(size||3)},()=>({text:'',done:false}))};
}
function renderAllBoards(){
  const container=document.getElementById('bingo-boards-container');container.innerHTML='';
  if(!appData.bingo.boards||!appData.bingo.boards.length){appData.bingo.boards=[newBoardData(3,1)];}
  appData.bingo.boards.forEach(b=>container.appendChild(createBoardCard(b)));
}
document.getElementById('add-board-btn').addEventListener('click',()=>{
  const b=newBoardData(3,appData.bingo.boards.length+1);appData.bingo.boards.push(b);
  const card=createBoardCard(b);document.getElementById('bingo-boards-container').appendChild(card);
  card.scrollIntoView({behavior:'smooth',block:'start'});scheduleSave('bingo');
});

function createTodoList(key,listId,inputId,addBtnId,clearBtnId,countId){
  if(!appData[key])appData[key]={items:[]};
  if(!appData[key].items)appData[key].items=[];
  const listEl=document.getElementById(listId);
  const inputEl=document.getElementById(inputId);
  const countEl=document.getElementById(countId);
  function render(){
    listEl.innerHTML='';const items=appData[key].items;
    if(!items.length){const h=document.createElement('div');h.className='todo-empty-hint';h.textContent='入力欄から追加してください';listEl.appendChild(h);if(countEl)countEl.textContent='';return;}
    items.forEach(item=>{
      const row=document.createElement('div');row.className='todo-row'+(item.done?' done':'');
      const sw=document.createElement('div');sw.className='todo-stamp-wrap';
      if(item.done){const s=document.createElement('div');s.className='stamp-mark small';s.textContent='済';s.addEventListener('click',()=>{item.done=false;render();scheduleSave(key);});sw.appendChild(s);}
      else{const b=document.createElement('button');b.className='stamp-btn small';b.textContent='印';b.addEventListener('click',()=>{item.done=true;render();scheduleSave(key);});sw.appendChild(b);}
      row.appendChild(sw);
      const text=document.createElement('div');text.className='todo-text';text.textContent=item.text;row.appendChild(text);
      const del=document.createElement('button');del.className='todo-del';del.textContent='×';del.addEventListener('click',()=>{appData[key].items=appData[key].items.filter(i=>i.id!==item.id);render();scheduleSave(key);});row.appendChild(del);
      listEl.appendChild(row);
    });
    if(countEl){const done=items.filter(i=>i.done).length;countEl.textContent=items.length?`${done}/${items.length} 完了`:''; }
  }
  function addItem(){
    const text=inputEl.value.trim();if(!text)return;
    appData[key].items.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),text,done:false});
    render();scheduleSave(key);inputEl.value='';inputEl.focus();
  }
  document.getElementById(addBtnId).addEventListener('click',addItem);
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});
  (function(){let p=false,t=null;const btn=document.getElementById(clearBtnId);btn.addEventListener('click',()=>{
    if(!p){p=true;btn.textContent='もう一度タップで確定';btn.style.color='var(--vermillion)';t=setTimeout(()=>{p=false;btn.textContent='リストをクリア';btn.style.color='';},3000);}
    else{clearTimeout(t);p=false;btn.textContent='リストをクリア';btn.style.color='';appData[key].items=[];render();scheduleSave(key);}
  });})();
  render();
}

// ---- Deadline list ----
function initDeadlineList(){
  if(!appData.deadline)appData.deadline={items:[]};
  if(!appData.deadline.items)appData.deadline.items=[];
  const listEl=document.getElementById('deadline-list');const inputEl=document.getElementById('deadline-input');const dateEl=document.getElementById('deadline-date');const countEl=document.getElementById('deadline-count');
  function dateLabel(dateStr){
    if(!dateStr)return null;const today=new Date();today.setHours(0,0,0,0);const d=new Date(dateStr+'T00:00:00');const diff=Math.round((d-today)/86400000);
    if(diff<0)return{text:`${Math.abs(diff)}日超過`,cls:'overdue'};if(diff===0)return{text:'今日が期限',cls:'soon'};if(diff<=3)return{text:`あと${diff}日`,cls:'soon'};
    const m=d.getMonth()+1,day=d.getDate();return{text:`${m}/${day}まで`,cls:''};
  }
  function render(){
    listEl.innerHTML='';const items=appData.deadline.items;
    const sorted=[...items].sort((a,b)=>{if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date);});
    if(!sorted.length){const h=document.createElement('div');h.className='todo-empty-hint';h.textContent='入力欄から追加してください';listEl.appendChild(h);countEl.textContent='';return;}
    sorted.forEach(item=>{
      const row=document.createElement('div');row.className='todo-row'+(item.done?' done':'');
      const sw=document.createElement('div');sw.className='todo-stamp-wrap';
      if(item.done){const s=document.createElement('div');s.className='stamp-mark small';s.textContent='済';s.addEventListener('click',()=>{item.done=false;render();scheduleSave('deadline');});sw.appendChild(s);}
      else{const b=document.createElement('button');b.className='stamp-btn small';b.textContent='印';b.addEventListener('click',()=>{item.done=true;render();scheduleSave('deadline');});sw.appendChild(b);}
      row.appendChild(sw);
      const tw=document.createElement('div');tw.className='todo-text-wrap';
      const text=document.createElement('div');text.className='todo-text';text.textContent=item.text;tw.appendChild(text);
      if(item.date&&!item.done){const info=dateLabel(item.date);if(info){const chip=document.createElement('span');chip.className='deadline-chip'+(info.cls?' '+info.cls:'');chip.textContent=info.text;tw.appendChild(chip);}}
      row.appendChild(tw);
      const del=document.createElement('button');del.className='todo-del';del.textContent='×';del.addEventListener('click',()=>{appData.deadline.items=appData.deadline.items.filter(i=>i.id!==item.id);render();scheduleSave('deadline');});row.appendChild(del);
      listEl.appendChild(row);
    });
    const done=items.filter(i=>i.done).length;countEl.textContent=items.length?`${done}/${items.length} 完了`:'';
  }
  function addItem(){const text=inputEl.value.trim();if(!text)return;appData.deadline.items.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),text,date:dateEl.value||'',done:false});render();scheduleSave('deadline');inputEl.value='';dateEl.value='';inputEl.focus();}
  document.getElementById('deadline-add').addEventListener('click',addItem);
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});
  (function(){let p=false,t=null;const btn=document.getElementById('deadline-clear');btn.addEventListener('click',()=>{
    if(!p){p=true;btn.textContent='もう一度タップで確定';btn.style.color='var(--vermillion)';t=setTimeout(()=>{p=false;btn.textContent='リストをクリア';btn.style.color='';},3000);}
    else{clearTimeout(t);p=false;btn.textContent='リストをクリア';btn.style.color='';appData.deadline.items=[];render();scheduleSave('deadline');}
  });})();
  render();
}

  function addItem(){const text=inputEl.value.trim();if(!text)return;appData.entame.items.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),text,cat:selectedCat,done:false});render();scheduleSave('entame');inputEl.value='';inputEl.focus();}
  document.getElementById('entame-add').addEventListener('click',addItem);
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});
  (function(){let p=false,t=null;const btn=document.getElementById('entame-clear');btn.addEventListener('click',()=>{
    if(!p){p=true;btn.textContent='もう一度タップで確定';btn.style.color='var(--vermillion)';t=setTimeout(()=>{p=false;btn.textContent='リストをクリア';btn.style.color='';},3000);}
    else{clearTimeout(t);p=false;btn.textContent='リストをクリア';btn.style.color='';appData.entame.items=[];render();scheduleSave('entame');}
  });})();
  render();
}

// ---- Tabs ----
function initTabs(){
  const btns=Array.from(document.querySelectorAll('.tab-btn'));
  const panels=Array.from(document.querySelectorAll('.tab-panel'));
  function switchTab(name){
    btns.forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
    panels.forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));
    if(!appData.settings)appData.settings={};appData.settings.activeTab=name;scheduleSave('settings');
  }
  btns.forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
  const saved=appData.settings&&appData.settings.activeTab;
  if(saved&&btns.some(b=>b.dataset.tab===saved))switchTab(saved);
}

}
