<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ボード2 復元</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;min-height:100vh;background:#F7F2E7;font-family:sans-serif;display:flex;align-items:center;justify-content:center;}
.card{background:#fffdf8;border:1px solid #d8cdb2;border-radius:16px;padding:36px 28px;max-width:360px;width:100%;text-align:center;}
h1{font-size:20px;color:#272320;margin:0 0 8px;}
p{font-size:13px;color:#6b6258;margin:0 0 20px;line-height:1.7;}
input{display:block;width:100%;border:1px solid #d8cdb2;border-radius:8px;padding:11px 12px;font-size:14px;background:#fffdf8;outline:none;margin-bottom:10px;box-sizing:border-box;}
button{display:block;width:100%;padding:13px;border:none;border-radius:999px;background:#2C3C63;color:#F7F2E7;font-size:14px;cursor:pointer;margin-bottom:10px;}
#msg{font-size:13px;margin-top:12px;min-height:20px;line-height:1.7;}
.ok{color:#3a7a4a;font-weight:bold;}
.err{color:#B5392C;}
</style>
</head>
<body>
<div class="card">
  <h1>ボード2 復元</h1>
  <p>ログインするとボード2のデータを<br>スクショの内容に復元します。<br>一度だけ使うページです。</p>
  <input type="email" id="email" placeholder="メールアドレス" autocomplete="email">
  <input type="password" id="pass" placeholder="パスワード" autocomplete="current-password">
  <button id="btn">ログインして復元する</button>
  <div id="msg"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDMsXptQ0v_qCFpz0UqFEoeVsCfdJFvvXA",
  authDomain:"todo-bingo-e734d.firebaseapp.com",
  projectId:"todo-bingo-e734d",
  storageBucket:"todo-bingo-e734d.firebasestorage.app",
  messagingSenderId:"643215171914",
  appId:"1:643215171914:web:f717466c189af87277a1b3"
});
const auth=firebase.auth();
const db=firebase.firestore();

// スクショから読み取ったボード2のデータ
const RESTORED_CELLS=[
  {text:"Amazonキッズインラブ12日",done:false},
  {text:"Amazon私、オルガ14日",done:false},
  {text:"Amazon今夜、世界からこの恋が19日",done:false},
  {text:"Netflix再会の街で13日",done:false},
  {text:"Amazonグランド・ブダペスト・ホテル12日",done:false},
  {text:"Amazon君の膵臓19日",done:false},
  {text:"Amazon ミーガン吹き替え20日",done:false},
  {text:"水の中",done:true},
  {text:"",done:false}
];

document.getElementById('btn').addEventListener('click',async()=>{
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');
  if(!email||!pass){msg.className='err';msg.textContent='メールアドレスとパスワードを入力してください';return;}
  btn.textContent='復元中...';btn.disabled=true;msg.textContent='';
  try{
    const cred=await auth.signInWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    // Firestoreの現在のbingoデータを読み込む
    const doc=await db.collection('users').doc(uid).collection('appdata').doc('bingo').get();
    let bingoData=doc.exists?doc.data():{boards:[]};
    if(!bingoData.boards)bingoData.boards=[];
    // ボード2を探して復元（なければ追加）
    const idx=bingoData.boards.findIndex(b=>b.title==='ボード2');
    if(idx>=0){
      bingoData.boards[idx].cells=RESTORED_CELLS;
      bingoData.boards[idx].size=3;
    }else{
      bingoData.boards.push({
        id:Date.now()+'-restore',
        title:'ボード2',
        size:3,
        cells:RESTORED_CELLS
      });
    }
    await db.collection('users').doc(uid).collection('appdata').doc('bingo').set(bingoData);
    msg.className='ok';
    msg.innerHTML='✅ 復元完了！<br><a href="https://1appleck12-blip.github.io/todo-bingo/" style="color:#2C3C63;">やることノートを開く →</a>';
    btn.textContent='完了';
  }catch(e){
    msg.className='err';
    msg.textContent='エラー: '+e.message;
    btn.textContent='ログインして復元する';btn.disabled=false;
  }
});
</script>
</body>
</html>
